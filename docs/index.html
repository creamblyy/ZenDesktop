<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenDesktop — Модифицированный Telegram клиент</title>
  <meta name="description" content="Модифицированный кросс-платформенный Telegram клиент с огромным количеством собственного и перенесённого функционала.">
  <link rel="icon" type="image/png" href="avatar_electric_left.png">
  <style>
    :root {
      --electric-blue: #2b3cff;
      --electric-glow: rgba(43, 60, 255, 0.4);
      --cream: #f4efe6;
      --near-black: #0c0e14;
      
      /* Liquid Glass (iOS 26) Ultra Smooth */
      --glass-bg: rgba(16, 20, 32, 0.65);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-inner-spec: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.3);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --glass-blur: blur(14px);
      
      --radius-island: 28px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--near-black);
      color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Full-screen 1080p 60fps Video Background */
    .bg-video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }

    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0);
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(12, 14, 20, 0.15) 0%, rgba(12, 14, 20, 0.55) 100%);
    }

    /* Main Centered Layout */
    .viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 760px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transform: translateZ(0);
    }

    /* Liquid Glass Island */
    .liquid-island {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-inner-spec), var(--glass-shadow);
      border-radius: var(--radius-island);
      transform: translateZ(0);
      will-change: transform;
    }

    /* Top Brand Pill */
    .nav-pill-island {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px 8px 10px;
      border-radius: var(--radius-pill);
    }

    .brand-avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 10px var(--electric-glow);
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .brand-version {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      color: rgba(244, 239, 230, 0.55);
    }

    /* Main Hero Island */
    .main-card {
      width: 100%;
      padding: 56px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .main-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 30px var(--electric-glow), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    .main-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .main-description {
      font-size: 1.15rem;
      line-height: 1.6;
      color: rgba(244, 239, 230, 0.85);
      max-width: 580px;
      font-weight: 400;
    }

    /* Action Buttons (Liquid Glass Islands) */
    .buttons-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      width: 100%;
    }

    .btn-island-primary {
      background: var(--electric-blue);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      padding: 16px 36px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 28px var(--electric-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-island-primary:hover {
      transform: translateY(-2px);
      background: #3849ff;
    }

    .btn-island-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--cream);
      font-weight: 600;
      font-size: 1rem;
      padding: 16px 28px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-island-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.38);
      transform: translateY(-2px);
    }

    /* Meta Info Pill */
    .meta-island {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      border-radius: var(--radius-pill);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      color: rgba(244, 239, 230, 0.6);
    }

    @media (max-width: 600px) {
      .main-card {
        padding: 40px 24px;
      }
      .buttons-group {
        flex-direction: column;
      }
      .btn-island-primary, .btn-island-secondary {
        width: 100%;
        justify-content: center;
      }
      .meta-island {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Full-screen 1080p 60fps Video Background -->
  <div class="bg-video-container">
    <video class="bg-video" autoplay loop muted playsinline>
      <source src="bg_1080p_60fps.mp4" type="video/mp4">
      <source src="docs/bg_1080p_60fps.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
  </div>

  <div class="viewport">

    <!-- Top Brand Pill Island -->
    <div class="liquid-island nav-pill-island">
      <img src="avatar_electric_left.png" alt="ZenDesktop" class="brand-avatar-img">
      <span class="brand-title">ZenDesktop</span>
      <span class="brand-version">v1.0.0</span>
    </div>

    <!-- Main Island -->
    <main class="liquid-island main-card">
      <img src="avatar_electric_left.png" alt="ZenDesktop Logo" class="main-avatar">
      
      <h1 class="main-title">ZenDesktop</h1>

      <p class="main-description">
        Модифицированный кросс-платформенный Telegram клиент с огромным количеством собственного и перенесённого функционала.
      </p>

      <div class="buttons-group">
        <a href="https://github.com/creamblyy/ZenDesktop/releases" class="btn-island-primary" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Скачать для Windows</span>
        </a>

        <a href="https://github.com/creamblyy/ZenDesktop" class="btn-island-secondary" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </main>

  </div>

</body>
</html>
