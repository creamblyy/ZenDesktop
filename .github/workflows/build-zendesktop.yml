name: Build ZenDesktop Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - dev
      - zen
    paths:
      - 'Telegram/**'
      - '.github/workflows/build-zendesktop.yml'

jobs:
  build-windows:
    name: Build ZenDesktop (x64 Release)
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      TBUILD_PATH: D:\TBuild
      SKIP_DUMPSYMS: "1"
      CARGO_INCREMENTAL: "0"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clean up disk space
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Get-Service docker -ErrorAction SilentlyContinue | Stop-Service -ErrorAction SilentlyContinue
          wsl --shutdown 2> $null
          Remove-Item "C:\Android\android-sdk", "C:\Program Files\dotnet", "C:\Miniconda", "C:\msys64", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\Docker", "C:\ProgramData\DockerDesktop", "C:\Program Files\PostgreSQL", "C:\PostgreSQL", "C:\Program Files\MongoDB", "C:\Program Files\MySQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup", "C:\cabal", "C:\Program Files\LLVM", "C:\vcpkg", "C:\tools\kotlinc", "C:\tools\php", "C:\tools\Apache24", "C:\tools\nginx-*", "C:\selenium", "C:\SeleniumWebDrivers", "C:\Program Files\R", "C:\Program Files (x86)\R", "C:\rtools*", "C:\Program Files\Google\Chrome*", "C:\Program Files (x86)\Google\Chrome*", "C:\Program Files\Mozilla Firefox*", "C:\ProgramData\Package Cache" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages" -Exclude _Instances -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item C:\hostedtoolcache\windows\Go*, C:\hostedtoolcache\windows\Ruby*, C:\hostedtoolcache\windows\PyPy*, C:\hostedtoolcache\windows\Java_*, C:\hostedtoolcache\windows\NuGet* -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ('Freed disk space: {0:N1} GB -> {1:N1} GB free' -f $before, ((Get-PSDrive C).Free / 1GB))

      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Checkout ZenDesktop Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop
          fetch-depth: 100

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Setup TBuild Directories
        run: |
          mkdir %GITHUB_WORKSPACE%\Libraries\win64
          mkdir %GITHUB_WORKSPACE%\ThirdParty
          echo LibrariesPath=%GITHUB_WORKSPACE%\Libraries\win64>>%GITHUB_ENV%
          echo ThirdPartyPath=%GITHUB_WORKSPACE%\ThirdParty>>%GITHUB_ENV%

      - name: Restore Third-Party Libraries from Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseTag = "deps-v1"
          $repo = "${{ github.repository }}"
          $exists = gh release view $releaseTag -R $repo --json assets 2>$null
          if ($LASTEXITCODE -eq 0 -and $exists) {
              $assets = ($exists | ConvertFrom-Json).assets
              if ($assets.Count -gt 0) {
                  Write-Host "Found $releaseTag release with $($assets.Count) parts. Downloading..."
                  $dlDir = "$env:TEMP\deps_dl"
                  New-Item -ItemType Directory -Path $dlDir -Force | Out-Null
                  gh release download $releaseTag -R $repo --pattern "deps.7z.*" --dir $dlDir
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "Extracting split 7z archive into $env:GITHUB_WORKSPACE..."
                      & 7z x "$dlDir\deps.7z.001" "-o$env:GITHUB_WORKSPACE" -y
                      if ($LASTEXITCODE -eq 0) {
                          "DEPS_FROM_RELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                          Write-Host "Successfully restored third-party libraries from GitHub Release."
                      }
                  }
                  Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue
              }
          } else {
              Write-Host "No $releaseTag release found yet; falling back to cache or build."
          }
          $global:LASTEXITCODE = 0

      - name: Restore Third-Party Libraries Cache
        if: env.DEPS_FROM_RELEASE != 'true'
        uses: actions/cache/restore@v4
        id: libs-cache
        with:
          path: |
            ${{ env.ThirdPartyPath }}
            ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-deps-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-x64-deps-

      - name: Prepare Third-Party Libraries
        if: env.DEPS_FROM_RELEASE != 'true'
        run: |
          set SKIP_DUMPSYMS=1
          set CARGO_INCREMENTAL=0
          cd %GITHUB_WORKSPACE%\tdesktop
          call Telegram\build\prepare\win.bat silent

      - name: Purge Intermediate Objects Before Cache
        if: success() && env.DEPS_FROM_RELEASE != 'true' && steps.libs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:LibrariesPath" -Filter "*.obj" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*\objects-*" } | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "$env:ThirdPartyPath" -Filter "*.obj" -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "$env:LibrariesPath" -Filter "*.pdb" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*\objects-*" } | Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host "Intermediate build objects purged to keep cache archive lightweight and fast."

      - name: Save Third-Party Libraries to Release
        if: success() && env.DEPS_FROM_RELEASE != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $outDir = "$env:TEMP\deps_out"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Packing Libraries and ThirdParty into 1.9GB split 7z volumes..."
          & 7z a -v1900m -mx=1 "$outDir\deps.7z" Libraries ThirdParty
          if ($LASTEXITCODE -eq 0) {
              $repo = "${{ github.repository }}"
              $parts = Get-ChildItem -Path $outDir -Filter "deps.7z.*" | ForEach-Object { $_.FullName }
              gh release view deps-v1 -R $repo 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                  gh release delete deps-v1 -R $repo -y 2>$null
              }
              gh release create deps-v1 $parts -R $repo --target "${{ github.sha }}" --title "ZenDesktop Build Dependencies Cache" --notes "Automated split 7z cache for ThirdParty and Libraries (frees 10GB actions/cache for out/)" --prerelease
              if ($LASTEXITCODE -ne 0) {
                  Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
                  throw "gh release create deps-v1 failed with exit code $LASTEXITCODE"
              }
              Write-Host "Uploaded $($parts.Count) volumes to release deps-v1."
          } else {
              Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
              throw "7z failed with exit code $LASTEXITCODE"
          }
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore Qt RCC Objects
        shell: pwsh
        run: |
          $qtPrefix = "$env:LibrariesPath\Qt-6.12.0"
          $stubCpp = "$env:TEMP\qt_rcc_stub.cpp"
          "// empty stub object" | Set-Content -Path $stubCpp -Encoding ascii
          $stubObj = "$env:TEMP\qt_stub.obj"
          & cl.exe /nologo /c /MD /wd4206 $stubCpp /Fo"$stubObj"

          $cmakeFiles = Get-ChildItem -Path "$qtPrefix" -Filter "*.cmake" -Recurse -File
          foreach ($file in $cmakeFiles) {
              $content = Get-Content $file.FullName -Raw
              $matches = [regex]::Matches($content, '([a-zA-Z0-9_\-\.\/\\:\$]{0,50}objects\-(Debug|Release|RelWithDebInfo)[a-zA-Z0-9_\-\.\/\\:]*\.obj)')
              foreach ($m in $matches) {
                  $val = $m.Value.Trim('"`''')
                  if ($val -match '^[a-zA-Z]:') {
                      $targetObj = $val.Replace('/', '\')
                  } else {
                      $clean = $val.Replace('${_IMPORT_PREFIX}', '').TrimStart('/\').Replace('/', '\')
                      $targetObj = "$qtPrefix\$clean"
                  }
                  if (-not (Test-Path $targetObj)) {
                      $dir = Split-Path $targetObj -Parent
                      if (-not (Test-Path $dir)) {
                          New-Item -ItemType Directory -Path $dir -Force | Out-Null
                      }
                      if ($targetObj -match '([a-zA-Z0-9]+)_init\.cpp\.obj$') {
                          $pluginName = $Matches[1]
                          $pluginCpp = "$env:TEMP\${pluginName}_init.cpp"
                          if ($pluginName -match '^Q[A-Z]') {
                              "#include <QtPlugin>`nQ_IMPORT_PLUGIN($pluginName)" | Set-Content -Path $pluginCpp -Encoding ascii
                              & cl.exe /nologo /c /MD /std:c++17 /Zc:__cplusplus /I "$qtPrefix\include" /I "$qtPrefix\include\QtCore" $pluginCpp /Fo"$targetObj"
                              if ($LASTEXITCODE -ne 0) {
                                  Write-Host "Warning: fallback to stub for plugin $pluginName"
                                  Copy-Item "$stubObj" -Destination "$targetObj" -Force
                              } else {
                                  Write-Host "Compiled real plugin initializer: $pluginName -> $targetObj"
                              }
                          } else {
                              "extern int qInitResources_${pluginName}();`nnamespace { struct RsrcInit { RsrcInit() { qInitResources_${pluginName}(); } }; static const RsrcInit init; }" | Set-Content -Path $pluginCpp -Encoding ascii
                              & cl.exe /nologo /c /MD /std:c++17 /Zc:__cplusplus $pluginCpp /Fo"$targetObj"
                              if ($LASTEXITCODE -ne 0) {
                                  Write-Host "Warning: fallback to stub for resource $pluginName"
                                  Copy-Item "$stubObj" -Destination "$targetObj" -Force
                              } else {
                                  Write-Host "Compiled real resource initializer: $pluginName -> $targetObj"
                              }
                          }
                      } else {
                          Copy-Item "$stubObj" -Destination "$targetObj" -Force
                          Write-Host "Restored: $targetObj"
                      }
                  }
              }
          }
          $global:LASTEXITCODE = 0
          Write-Host "Qt resource and plugin objects verification complete."

      - name: Restore Build Output Cache
        uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: tdesktop/out
          key: ${{ runner.os }}-x64-out-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-x64-out-v2-

      - name: Synchronize Timestamps for Incremental Build
        if: steps.build-cache.outputs.cache-hit == 'true' || steps.build-cache.outputs.cache-matched-key != ''
        shell: pwsh
        run: |
          Write-Host "Updating timestamps of cached objects for fast incremental build..."
          $now = Get-Date
          Get-ChildItem -Path "tdesktop\out" -Filter "*.obj" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $_.LastWriteTime = $now
          }
          $shaFile = "tdesktop\out\.zen_cached_sha"
          $baseSha = if (Test-Path $shaFile) { (Get-Content $shaFile -Raw).Trim() } else { "HEAD~1" }
          if ($baseSha -eq "53adb3b4219b20dffa0e6e1e5cf6c49033580873") {
              $baseSha = "80f7d783e9b76f123b1a6386c8853128b55b2d84"
          }
          Write-Host "Diffing changed files against cached commit: $baseSha"
          git -C tdesktop status --porcelain | ForEach-Object {
              $file = $_.Substring(3).Trim()
              $fullPath = "tdesktop\$file"
              if (Test-Path $fullPath) {
                  (Get-Item $fullPath).LastWriteTime = (Get-Date).AddMinutes(1)
                  Write-Host "Marked modified for recompilation: $file"
              }
          }
          $diffFiles = git -C tdesktop diff --name-only $baseSha HEAD 2>$null
          if ($LASTEXITCODE -ne 0) {
              $diffFiles = git -C tdesktop diff --name-only HEAD~1 2>$null
          }
          $touchTime = (Get-Date).AddMinutes(1)
          $hasHeader = $false
          $diffFiles | ForEach-Object {
              if ($_ -like "*.h") { $hasHeader = $true }
              $fullPath = "tdesktop\$_"
              if (Test-Path $fullPath) {
                  (Get-Item $fullPath).LastWriteTime = $touchTime
                  Write-Host "Marked commit diff for recompilation: $_"
              }
          }
          if ($hasHeader) {
              $extraDeps = @(
                  "tdesktop\Telegram\SourceFiles\relay_hooks\*.cpp",
                  "tdesktop\Telegram\SourceFiles\core\application.cpp",
                  "tdesktop\Telegram\SourceFiles\settings\sections\settings_zen.cpp",
                  "tdesktop\Telegram\SourceFiles\settings\sections\settings_main.cpp",
                  "tdesktop\Telegram\SourceFiles\info\profile\info_profile_badge.cpp"
              )
              foreach ($pat in $extraDeps) {
                  Get-Item $pat -ErrorAction SilentlyContinue | ForEach-Object {
                      $_.LastWriteTime = $touchTime
                      Write-Host "Marked header-dependent for recompilation: $($_.Name)"
                  }
              }
          }

      - name: Configure CMake for ZenDesktop
        run: |
          cd %GITHUB_WORKSPACE%\tdesktop\Telegram
          call configure.bat x64 ^
            -T v143,host=x64 ^
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID || '611335' }} ^
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH || 'd524b414d21f4d37f08684c1df41ac9c' }} ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build ZenDesktop
        run: |
          cd %GITHUB_WORKSPACE%\tdesktop
          cmake --build out --config Release --target ZERO_CHECK
          cmake --build out --config Release --parallel -- /p:PreferredToolArchitecture=x64

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\artifact" -Force
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tdesktop\out" -Filter "Telegram.exe" -Recurse -File | Select-Object -First 1
          if ($exe) {
              Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\artifact\ZenDesktop.exe"
              Write-Host "ZenDesktop.exe found at: $($exe.FullName)"
          } else {
              Write-Error "Telegram.exe was not found in out directory!"
              exit 1
          }
          $updater = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tdesktop\out" -Filter "Updater.exe" -Recurse -File | Select-Object -First 1
          if ($updater) {
              Copy-Item $updater.FullName "$env:GITHUB_WORKSPACE\artifact\Updater.exe"
              Write-Host "Updater.exe found at: $($updater.FullName)"
          }
          Copy-Item "$env:GITHUB_WORKSPACE\tdesktop\Telegram\SourceFiles\relay_hooks\zen_badges.json" "$env:GITHUB_WORKSPACE\artifact\zen_badges.json"

      - name: Upload ZenDesktop Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenDesktop-Windows-x64
          path: artifact/
          retention-days: 14

      - name: Clean Heavy PDBs Before Cache Save
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tdesktop\out" -Filter "*.pdb" -Recurse -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          "${{ github.sha }}" | Set-Content -Path "$env:GITHUB_WORKSPACE\tdesktop\out\.zen_cached_sha" -Encoding ascii -NoNewline
          Write-Host "Cleaned PDB files and recorded cached commit SHA."

      - name: Save Build Output Cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: tdesktop/out
          key: ${{ runner.os }}-x64-out-v2-${{ github.sha }}
