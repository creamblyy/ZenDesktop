name: Build ZenDesktop Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - dev
      - zen
    paths:
      - 'Telegram/**'
      - '.github/workflows/build-zendesktop.yml'

jobs:
  build-windows:
    name: Build ZenDesktop (x64 Release)
    runs-on: windows-latest

    env:
      TBUILD_PATH: D:\TBuild

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clean up disk space
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Get-Service docker -ErrorAction SilentlyContinue | Stop-Service -ErrorAction SilentlyContinue
          Remove-Item "C:\Android\android-sdk", "C:\Miniconda", "C:\msys64", "$env:USERPROFILE\.cargo", "C:\Program Files\PostgreSQL" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ('Freed disk space: {0:N1} GB free' -f ((Get-PSDrive C).Free / 1GB))

      - name: Checkout ZenDesktop Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Setup TBuild Directories
        run: |
          mkdir %USERPROFILE%\TBuild\Libraries
          mkdir %USERPROFILE%\TBuild\ThirdParty
          echo TBUILD=%USERPROFILE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%USERPROFILE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Cache ThirdParty
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-x64-third-party-

      - name: Cache Libraries
        id: cache-libraries
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-libraries-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-x64-libraries-

      - name: Prepare Third-Party Libraries
        run: |
          cd %GITHUB_WORKSPACE%\tdesktop
          call Telegram\build\prepare\win.bat silent

      - name: Configure CMake for ZenDesktop
        run: |
          cd %GITHUB_WORKSPACE%\tdesktop\Telegram
          call configure.bat x64 ^
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID || '611335' }} ^
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH || 'd524b414d21f4d37f08684c1df41ac9c' }} ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build ZenDesktop
        run: |
          cd %GITHUB_WORKSPACE%\tdesktop
          cmake --build out --config Release --parallel

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\artifact" -Force
          $exePath = "$env:GITHUB_WORKSPACE\tdesktop\out\Release\Telegram.exe"
          if (Test-Path $exePath) {
              Copy-Item $exePath "$env:GITHUB_WORKSPACE\artifact\ZenDesktop.exe"
          }
          $updaterPath = "$env:GITHUB_WORKSPACE\tdesktop\out\Release\Updater.exe"
          if (Test-Path $updaterPath) {
              Copy-Item $updaterPath "$env:GITHUB_WORKSPACE\artifact\Updater.exe"
          }
          # Copy badges config
          Copy-Item "$env:GITHUB_WORKSPACE\tdesktop\Telegram\SourceFiles\relay_hooks\zen_badges.json" "$env:GITHUB_WORKSPACE\artifact\zen_badges.json"

      - name: Upload ZenDesktop Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenDesktop-Windows-x64
          path: artifact/
          retention-days: 14
